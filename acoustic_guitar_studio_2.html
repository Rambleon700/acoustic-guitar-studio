<header><h1>ACOUSTIC GUITAR STUDIO</h1><div class="stats" id="stats"></div></header>

<script>
(function(){
'use strict';
var NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
var OPEN=[40,45,50,55,59,64]; /* low E to high e */
var SN=['low E','A','D','G','B','high e'];
/* ---------- chord library: frets low E->high e, -1 = muted, f = fingers ---------- */
var CH={
G:{n:'G',fr:[3,2,0,0,0,3],f:[2,1,0,0,0,3],t:'Anchor your ring and pinky together; both move as a unit to Em, D and C.'},
C:{n:'C',fr:[-1,3,2,0,1,0],f:[0,3,2,0,1,0],t:'Angle the ring finger so its tip lightly touches the low E and silences it.'},
D:{n:'D',fr:[-1,-1,0,2,3,2],f:[0,0,0,1,3,2],t:'A tight triangle. Keep the thumb low behind the neck so the first finger stays relaxed.'},
Em:{n:'Em',fr:[0,2,2,0,0,0],f:[0,2,3,0,0,0],t:'The easiest chord. Use it to check each string rings: pluck one at a time.'},
Am:{n:'Am',fr:[-1,0,2,2,1,0],f:[0,0,2,3,1,0],t:'Same shape as E major moved one string set over. Mute the low E with your thumb or pick hand.'},
A:{n:'A',fr:[-1,0,2,2,2,0],f:[0,0,1,2,3,0],t:'Three in a row: try a flat first-finger barre across D, G and B if fingers feel cramped.'},
E:{n:'E',fr:[0,2,2,1,0,0],f:[0,2,3,1,0,0],t:'Slide the whole shape up one string set from Am. Strum all six strings.'},
Dm:{n:'Dm',fr:[-1,-1,0,2,3,1],f:[0,0,0,2,3,1],t:'Moody and small. Strum only the top four strings.'},
F:{n:'F',fr:[1,3,3,2,1,1],f:[1,3,4,2,1,1],t:'Full barre: E shape moved up. Roll the index slightly onto its bony edge and keep the thumb low behind the neck.'},
Bm:{n:'Bm',fr:[-1,2,4,4,3,2],f:[0,1,3,4,2,1],t:'A-shape minor barre on fret 2. Barre the top five strings, then add the three-finger block.'},
G7:{n:'G7',fr:[3,2,0,0,0,1],f:[3,2,0,0,0,1],t:'From G, lift the pinky and put the index finger on the first fret of the high e.'},
C7:{n:'C7',fr:[-1,3,2,3,1,0],f:[0,3,2,4,1,0],t:'C shape plus the pinky on the G string, third fret.'},
D7:{n:'D7',fr:[-1,-1,0,2,1,3],f:[0,0,0,2,1,3],t:'A compact "flat" D shape that sits well under a lead melody.'},
A7:{n:'A7',fr:[-1,0,2,0,2,0],f:[0,0,2,0,3,0],t:'Lift one finger off A and you have it. A bluesy colour change.'},
E7:{n:'E7',fr:[0,2,0,1,0,0],f:[0,2,0,1,0,0],t:'E major with the ring finger lifted. Two fingers only.'},
B7:{n:'B7',fr:[-1,2,1,2,0,2],f:[0,2,1,3,0,4],t:'The classic stretch. Take it slowly; it is the V chord in E.'},
Cadd9:{n:'Cadd9',fr:[-1,3,2,0,3,0],f:[0,2,1,0,3,0],t:'Shimmering alternative to C; shares fingers with G so changes are tiny.'},
Fmaj7:{n:'Fmaj7',fr:[-1,-1,3,2,1,0],f:[0,0,3,2,1,0],t:'A barre-free F. Staircase shape, top four strings only.'},
Asus2:{n:'Asus2',fr:[-1,0,2,2,0,0],f:[0,0,1,2,0,0],t:'Open and airy. Resolve it to A or Am.'},
Dsus4:{n:'Dsus4',fr:[-1,-1,0,2,3,3],f:[0,0,0,1,3,4],t:'Hang on the pinky, then release to D for a classic suspended resolve.'}};
var ORDER=['G','C','D','Em','Am','A','E','Dm','F','Bm','G7','C7','D7','A7','E7','B7','Cadd9','Fmaj7','Asus2','Dsus4'];
/* ---------- state + storage ---------- */
var S={tab:'learn',chord:'G',prog:['G','C','Em','D'],mode:'strum',bpm:80,pat:'Old faithful',pcur:-1,pchord:-1,play:false,
 tr:{a:'G',b:'C',run:false,left:60,count:0},fb:{t:null,streak:0,labels:false,msg:''},capo:7,
 pr:{dur:30,run:false,blk:0,left:0,blocks:[]}};
var mem={};
function ls(k,v){try{if(v===undefined){var r=localStorage.getItem(k);return r?JSON.parse(r):mem[k]||null}localStorage.setItem(k,JSON.stringify(v))}catch(e){if(v===undefined)return mem[k]||null;mem[k]=v}}
var D=ls('agStudio')||{log:{},best:{},fbBest:0};D.sec=D.sec||{};D.done=D.done||{};D.tried=D.tried||{};D.earBest=D.earBest||0;
function save(){ls('agStudio',D)}
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function streak(){var n=0,d=new Date();if(!D.log[dk(d)])d.setDate(d.getDate()-1);while(D.log[dk(d)]){n++;d.setDate(d.getDate()-1)}return n}
function dk(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function weekMins(){var t=0,d=new Date(),i;for(i=0;i<7;i++){t+=D.log[dk(d)]||0;d.setDate(d.getDate()-1)}return Math.round(t/60)}
/* ---------- audio: Karplus-Strong plucked string ---------- */

 if(AC.state==='suspended')AC.resume();return AC}
function ksBuf(m){if(cache[m])return cache[m];var sr=AC.sampleRate,f=440*Math.pow(2,(m-69)/12),N=Math.max(2,Math.round(sr/f)),len=Math.floor(sr*2.4),

 for(i=0;i<N;i++){var r=Math.random()*2-1;L[i]=(r+pv)*.5;pv=r}
 for(i=0;i<len;i++){var a=L[p],q=L[(p+1)%N];L[p]=(a+q)*.5*dec;d[i]=a*.6;p=(p+1)%N}
 cache[m]=b;return b}
function pluck(m,when,vel){ac();var s=AC.createBufferSource(),g=AC.createGain(),lp=AC.createBiquadFilter();s.buffer=ksBuf(m);
 lp.type='lowpass';lp.frequency.value=2600+vel*3000;g.gain.value=vel;s.connect(lp);lp.connect(g);g.connect(master);s.start(when||AC.currentTime)}
function click(when,acc){ac();var o=AC.createOscillator(),g=AC.createGain();o.frequency.value=acc?1500:1000;g.gain.setValueAtTime(.15,when);g.gain.exponentialRampToValueAtTime(.0001,when+.05);o.connect(g);g.connect(master);o.start(when);o.stop(when+.06)}
function strings(k){var r=[],i;for(i=0;i<6;i++)if(CH[k].fr[i]>=0)r.push(i);return r}
function midi(k,i){return OPEN[i]+CH[k].fr[i]}
function strum(k,dir,when,vel){var s=strings(k),i;if(dir==='U')s=s.slice(-4).reverse();for(i=0;i<s.length;i++)pluck(midi(k,s[i]),(when||ac().currentTime)+i*.014,vel*(.8+.2*i/s.length))}
function bassStr(k){return strings(k)[0]}
function altStr(k){var r=bassStr(k),a=r===0?2:r+1;return CH[k].fr[a]>=0?a:r}
/* ---------- chord diagram (SVG, hex written directly) ---------- */
function diagram(k,w){var c=CH[k],ob=c.b?c.b-1:0,x0=24,y0=40,sw=18,fh=26,s='',i,j;
 s+='<svg viewBox="0 0 140 180" width="'+w+'" role="img" aria-label="'+k+' chord diagram">'+(c.b?'<text x="1" y="'+(y0+17)+'" font-size="11" fill="#555b6b">'+c.b+'fr</text>':'<rect x="'+(x0-2)+'" y="'+(y0-4)+'" width="'+(5*sw+4)+'" height="5" fill="#111111"/>')+'';
 for(j=1;j<=4;j++)s+='<line x1="'+x0+'" x2="'+(x0+5*sw)+'" y1="'+(y0+j*fh)+'" y2="'+(y0+j*fh)+'" stroke="#8a93a8" stroke-width="2"/>';
 for(i=0;i<6;i++){var x=x0+i*sw,f=c.fr[i];s+='<line x1="'+x+'" x2="'+x+'" y1="'+y0+'" y2="'+(y0+4*fh)+'" stroke="#555b6b" stroke-width="'+(1+(5-i)*.25)+'"/>';
  if(f<0)s+='<text x="'+x+'" y="'+(y0-14)+'" text-anchor="middle" font-size="15" font-weight="700" fill="#c8102e">×</text>';
  else if(f===0)s+='<circle cx="'+x+'" cy="'+(y0-18)+'" r="5" fill="none" stroke="#1a7f37" stroke-width="2"/>';
  else{s+='<circle cx="'+x+'" cy="'+(y0+(f-ob-.5)*fh)+'" r="9" fill="#1c3f94"/><text x="'+x+'" y="'+(y0+(f-ob-.5)*fh+4.5)+'" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">'+c.f[i]+'</text>'}}
 return s+'</svg>'}
function noteNames(k){var o=[],i;for(i=0;i<6;i++)if(CH[k].fr[i]>=0)o.push(NOTES[midi(k,i)%12]);return o.join(' ')}
/* ---------- rhythm engine (look-ahead scheduler on the audio clock) ---------- */
var STR={'Down 8ths':['D','U','D','U','D','U','D','U'],'Old faithful':['D','-','D','U','-','U','D','U'],'Campfire':['D','-','D','-','D','U','D','-'],'Boom-chick':['B','-','D','-','B','-','D','-']};
var FIN={'Travis':['R','3','A','2','R','3','A','1'],'Rolling':['R','3','2','1','2','3','2','1'],'Ballad pulse':['R','2','3','2','R','2','3','2']};
var RE={step:0,next:0,bar:0,timer:null,pat:null};
function pattern(){return S.mode==='strum'?STR[S.pat]:FIN[S.pat]}
function stepAt(i,k,when,spb){var t=pattern()[i%8],v;
 if(S.mode==='strum'){if(t==='D'){strum(k,'D',when,i===0?1:.8)}else if(t==='U'){strum(k,'U',when,.55)}
  else if(t==='B'){pluck(midi(k,bassStr(k)),when,.95)}}
 else{var s=t==='R'?bassStr(k):t==='A'?altStr(k):parseInt(t,10)===3?3:parseInt(t,10)===2?4:5;if(CH[k].fr[s]>=0)pluck(midi(k,s),when,t==='R'||t==='A'?.9:.65)}}
function tick(){var step=30/S.bpm,la=ac().currentTime+.15;
 while(RE.next<la){var k=S.prog[RE.bar%S.prog.length],i=RE.step;stepAt(i,k,RE.next,step);if(i%2===0)click(RE.next,i===0);
  (function(i,bar,d){setTimeout(function(){if(S.play){S.pcur=i;S.pchord=bar%S.prog.length;paintPlay()}},d)})(i,RE.bar,Math.max(0,(RE.next-AC.currentTime)*1000));
  RE.next+=step;RE.step++;if(RE.step>=8){RE.step=0;RE.bar++}}}
function startPlay(){if(!S.prog.length)return;ac();S.play=true;RE.step=0;RE.bar=0;RE.next=AC.currentTime+.08;clearInterval(RE.timer);RE.timer=setInterval(tick,25);render()}
function stopPlay(){S.play=false;clearInterval(RE.timer);S.pcur=-1;S.pchord=-1;render()}
function paintPlay(){var cs=document.querySelectorAll('.pcell'),i,cc=document.querySelectorAll('.pchip');
 for(i=0;i<cs.length;i++)cs[i].className='cell pcell'+(cs[i].getAttribute('data-i')==='x'?'':'')+(cs[i].classList.contains('act')?' act':'')+(i===S.pcur?' now':'');
 for(i=0;i<cc.length;i++)cc[i].className='chip pchip'+(S.pchord>=0&&i===S.pchord+(S.poff||0)?' cur':'');
 var t=document.getElementById('tabout');if(t&&S.mode==='finger')t.innerHTML=tabFor(S.prog[S.pchord<0?0:S.pchord],S.pcur)}
function tabFor(k,cur){var L=['e','B','G','D','A','E'],out='',r,i,p=FIN[S.pat];if(!k)return'';
 out+='Chord: '+k+'   (R = root bass, A = alternate bass)\n';
 for(r=0;r<6;r++){var si=5-r;out+=L[r]+'|';for(i=0;i<8;i++){var t=p[i],s=t==='R'?bassStr(k):t==='A'?altStr(k):t==='3'?3:t==='2'?4:5,f=CH[k].fr[s];
  out+=(s===si&&f>=0)?(f+'').slice(-1)+(i===cur?'*':'-')+'-':'---'}out+='|\n'}
 return out+'  1 & 2 & 3 & 4 &'}
/* ---------- views ---------- */
var TABS=[['learn','Lessons & Hacks'],['chords','Chords'],['build','Progression Builder'],['song','Learn a Song'],['rhythm','Rhythm & Fingerstyle'],['fret','Fretboard'],['lead','Colour & Lead'],['ear','Ear Training'],['capo','Capo'],['practice','Practice']];
function nav(){var s='',i;for(i=0;i<TABS.length;i++)s+='<button data-a="tab" data-v="'+TABS[i][0]+'" class="'+(S.tab===TABS[i][0]?'on':'')+'">'+TABS[i][1]+'</button>';document.getElementById('nav').innerHTML=s}
function stats(){document.getElementById('stats').innerHTML='Streak <b>'+streak()+'</b> day'+(streak()===1?'':'s')+' · This week <b>'+weekMins()+'</b> min · Course <b>'+doneN()+'/'+LES.length+'</b>'}
function vChords(){var s='<div class="grid2"><div class="card"><h2>Open chord library</h2><div class="row">',i,k=S.chord,c=CH[k];

 s+='</div><p class="muted">Tap a chord to see and hear it. Tap a string below the diagram to hear it alone.</p></div>';

 s+='<div class="row"><button class="btn pri" data-a="strum" data-v="D">Strum ↓</button><button class="btn" data-a="strum" data-v="A">Arpeggio</button><button class="btn" data-a="addprog">+ Add to progression</button></div><div class="row" style="margin-top:8px">';
 for(i=0;i<6;i++)if(c.fr[i]>=0)s+='<button class="chip" data-a="str" data-v="'+i+'">'+SN[i]+'</button>';
 s+='</div></div></div>';
 s+='<div class="card"><h2>Chord-change trainer</h2><p class="muted">The fastest way to sound like a guitarist: clean changes between two chords. Count only changes where every string rings.</p><div class="row">';

 s+='<button class="btn pri" data-a="trgo">'+(S.tr.run?'Stop':'Start 60 s')+'</button><button class="btn" data-a="trhit"'+(S.tr.run?'':' disabled')+'>Clean change (Space)</button></div>';
 var key=S.tr.a+'-'+S.tr.b;s+='<div class="row"><span class="big" id="trclock">'+S.tr.left+'</span><span class="big" id="trcount">'+S.tr.count+'</span><span class="muted">seconds · changes · best for this pair: <b>'+(D.best[key]||0)+'</b></span></div>';
 s+='<div class="row">'+diagram(S.tr.a,90)+diagram(S.tr.b,90)+'</div></div>';return s}
function opts(sel){var s='',i;for(i=0;i<ORDER.length;i++)s+='<option'+(ORDER[i]===sel?' selected':'')+'>'+ORDER[i]+'</option>';return s}
function vRhythm(){var s='<div class="card"><div class="row"><button class="btn'+(S.mode==='strum'?' on':'')+'" data-a="mode" data-v="strum">Strumming</button><button class="btn'+(S.mode==='finger'?' on':'')+'" data-a="mode" data-v="finger">Fingerstyle</button></div>',i,P=S.mode==='strum'?STR:FIN,n;

 s+='</div><div class="row" style="margin:12px 0">';var p=pattern(),lab=['1','&','2','&','3','&','4','&'];

 s+='</div><p class="muted">'+(S.mode==='strum'?'D = down, U = up, B = bass note only, · = keep the hand moving but miss the strings. Your hand never stops swinging.':'R = root bass (thumb), A = alternate bass, 3/2/1 = G, B, high e strings (fingers). Thumb keeps the beat.')+'</p>';
 s+='<h2>Progression <span class="muted">one chord per bar</span></h2><div class="row">';
 for(i=0;i<S.prog.length;i++)s+='<button class="chip pchip'+(i===S.pchord?' cur':'')+'" data-a="delprog" data-v="'+i+'" title="Remove">'+(CH[S.prog[i]]?CH[S.prog[i]].n:S.prog[i])+' ✕</button>';

 s+='<div class="row" style="margin-top:12px"><button class="btn pri" data-a="play">'+(S.play?'■ Stop':'▶ Play')+'</button><label>Tempo <input type="range" min="50" max="140" value="'+S.bpm+'" data-a="bpm"> <b id="bpmv">'+S.bpm+'</b> BPM</label></div>';
 if(S.mode==='finger')s+='<pre id="tabout">'+tabFor(S.prog[0],-1)+'</pre>';
 return s+'<p class="muted">Start at 60 BPM, play along with the chime and click, then add 5 BPM only after four clean bars.</p></div>'}
function fbSvg(){var s='<svg viewBox="0 0 760 200" width="100%" role="img" aria-label="Fretboard"><rect x="40" y="14" width="700" height="150" fill="#eef1f6"/>',f,r,t=S.fb.t;
 for(f=0;f<=12;f++){var x=40+f*58;s+='<line x1="'+x+'" x2="'+x+'" y1="14" y2="164" stroke="'+(f===0?'#111111':'#8a93a8')+'" stroke-width="'+(f===0?5:2)+'"/><text x="'+(x+29)+'" y="186" text-anchor="middle" font-size="11" fill="#555b6b">'+(f?f:'')+'</text>'}
 [3,5,7,9,12].forEach(function(m){var cx=40+(m-.5)*58;if(m===12){s+='<circle cx="'+cx+'" cy="58" r="5" fill="#8a93a8"/><circle cx="'+cx+'" cy="120" r="5" fill="#8a93a8"/>'}else s+='<circle cx="'+cx+'" cy="89" r="5" fill="#8a93a8"/>'});

 for(i=0;i<A.length;i++)s+='<button class="btn" data-a="eans" data-v="'+i+'">'+A[i][0]+(e.m==='int'?'<br><span class="muted">'+A[i][2]+'</span>':'')+'</button>';
 return s+'</div><div aria-live="polite">'+e.msg+'</div></div>'}

/* ---------- Progression builder + Learn a song ---------- */
var FL=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'],FK=[1,3,5,8,10];
var DEG=[[0,'','I','Home: the chord that feels like arriving.'],[2,'m','ii','Gentle; leads naturally towards V.'],[4,'m','iii','Soft and wistful.'],[5,'','IV','Lifts away from home.'],[7,'','V','Tension that wants to resolve to I.'],[9,'m','vi','The relative minor: the sad cousin of I.']];
var PRE=[['Pop: I V vi IV',[0,4,5,3]],['50s: I vi IV V',[0,5,3,4]],['Folk: I IV V I',[0,3,4,0]],['Sad: vi IV I V',[5,3,0,4]],['Gospel: I IV I V',[0,3,0,4]],['Smooth: I iii IV V',[0,2,3,4]]];
S.key=7;S.bp=[0,4,5,3];S.sg=0;S.sk=7;S.poff=0;
function kn(i){return FK.indexOf(i)>=0?FL[i]:NOTES[i]}
function mkBarre(pc,q,n){var e=(pc+8)%12,a=(pc+3)%12,r,fr,f;
 if(e<a){r=e;fr=q?[r,r+2,r+2,r,r,r]:[r,r+2,r+2,r+1,r,r];f=q?[1,3,4,1,1,1]:[1,3,4,2,1,1]}
 else{r=a;fr=q?[-1,r,r+2,r+2,r+1,r]:[-1,r,r+2,r+2,r+2,r];f=q?[0,1,3,4,2,1]:[0,1,3,3,3,1]}
 return{n:n,fr:fr,f:f,b:r,g:1,t:'Movable barre shape on fret '+r+'. Slide the same shape along the neck to change key.'}}
function cid(k,d){var pc=(k+DEG[d][0])%12,q=DEG[d][1],id=NOTES[pc]+q;if(!CH[id]||CH[id].g)CH[id]=mkBarre(pc,q,(FK.indexOf(k)>=0?FL[pc]:NOTES[pc])+q);return id}
function patSel(){var s='<select data-a="bpat" aria-label="Pattern">',n;for(n in STR)s+='<option value="s:'+n+'"'+(S.mode==='strum'&&S.pat===n?' selected':'')+'>Strum: '+n+'</option>';for(n in FIN)s+='<option value="f:'+n+'"'+(S.mode==='finger'&&S.pat===n?' selected':'')+'>Finger: '+n+'</option>';return s+'</select>'}
function vBuild(){var k=S.key,s='<div class="card"><h2>Progression builder</h2><p class="muted">Pick a key. These six chords are the backbone of thousands of songs. Where there is no open shape, a movable barre shape is generated for you.</p><div class="row">',i;
 for(i=0;i<12;i++)s+='<button class="btn'+(i===k?' on':'')+'" data-a="bkey" data-v="'+i+'">'+kn(i)+'</button>';
 s+='</div></div><div class="card"><h2>Chords in '+kn(k)+' major</h2><div class="row" style="justify-content:space-around">';
 for(i=0;i<6;i++){var id=cid(k,i);s+='<div style="text-align:center;width:150px"><div class="muted">'+DEG[i][2]+'</div>'+diagram(id,100)+'<div><button class="btn" data-a="bhear" data-v="'+i+'">'+CH[id].n+'</button></div><div class="muted" style="font-size:12px">'+DEG[i][3]+'</div></div>'}
 s+='</div></div><div class="card"><h2>Your progression</h2><p class="muted">Presets:</p><div class="row">';
 for(i=0;i<PRE.length;i++)s+='<button class="btn" data-a="bpre" data-v="'+i+'">'+PRE[i][0]+'</button>';
 s+='</div><p class="muted">Add a chord (tap a chip to remove it):</p><div class="row">';
 for(i=0;i<6;i++)s+='<button class="btn" data-a="badd" data-v="'+i+'">+ '+DEG[i][2]+'</button>';
 s+='</div><div class="row" style="margin:12px 0">';
 for(i=0;i<S.bp.length;i++)s+='<button class="chip pchip" data-a="bdel" data-v="'+i+'">'+DEG[S.bp[i]][2]+' · '+CH[cid(k,S.bp[i])].n+'</button>';
 s+='</div><div class="row"><button class="btn pri" data-a="bplay">'+(S.play?'■ Stop':'▶ Play')+'</button>'+patSel()+'<label>Tempo <input type="range" min="50" max="140" value="'+S.bpm+'" data-a="bpm"> <b id="bpmv">'+S.bpm+'</b></label></div></div>';
 return s}
var FORM=['Intro','Verse','Chorus','Verse','Chorus','Bridge','Chorus','Outro'];
var SONGS=[
{n:'Campfire Folk Strummer',m:'strum',p:'Old faithful',bpm:90,les:[1,2,3,4,12],sec:{Intro:[0,3,0,4],Verse:[0,3,0,4],Chorus:[3,0,4,0],Bridge:[5,3,0,4],Outro:[0,3,0,0]},form:FORM},
{n:'Four-Chord Pop Anthem',m:'strum',p:'Down 8ths',bpm:100,les:[1,3,4,8,12],sec:{Intro:[0,4,5,3],Verse:[0,4,5,3],Chorus:[3,0,4,5],Bridge:[5,3,0,4],Outro:[3,0,4,0]},form:FORM},
{n:'Moonlit Ballad',m:'strum',p:'Campfire',bpm:72,les:[1,2,3,9,12],sec:{Intro:[5,3,0,4],Verse:[5,3,0,4],Chorus:[3,0,4,5],Bridge:[1,4,0,5],Outro:[5,3,0,0]},form:FORM},
{n:'Fingerstyle Etude',m:'finger',p:'Travis',bpm:70,les:[1,2,6,9,12],sec:{Intro:[0,3,0,4],Verse:[0,5,3,4],Chorus:[3,4,0,5],Outro:[3,0,0,0]},form:['Intro','Verse','Chorus','Verse','Chorus','Outro']}];
function sbars(sg,name){return sg.sec[name].map(function(d){return cid(S.sk,d)})}
function sflat(sg){var o=[],i;for(i=0;i<sg.form.length;i++)o=o.concat(sbars(sg,sg.form[i]));return o}
function uniq(sg){var o=[],i;for(i=0;i<sg.form.length;i++)if(o.indexOf(sg.form[i])<0)o.push(sg.form[i]);return o}
function vSong(){var g=SONGS[S.sg],s='<div class="card"><h2>Learn a song</h2><p class="muted">Lyric-free arrangements built from your lessons. Learn the chords, then the rhythm, then each section, then play it all the way through.</p><div class="row">',i,j,u=uniq(g),L=0;
 for(i=0;i<SONGS.length;i++)s+='<button class="btn'+(i===S.sg?' on':'')+'" data-a="sgsel" data-v="'+i+'">'+SONGS[i].n+'</button>';
 s+='</div><div class="row" style="margin-top:10px"><label>Key <select data-a="skey">';for(i=0;i<12;i++)s+='<option value="'+i+'"'+(i===S.sk?' selected':'')+'>'+kn(i)+'</option>';
 s+='</select></label><label>Tempo <input type="range" min="50" max="140" value="'+S.bpm+'" data-a="bpm"> <b id="bpmv">'+S.bpm+'</b></label><span class="muted">Pattern: '+g.p+'</span></div></div>';
 var ids=[],all=sflat(g);all.forEach(function(x){if(ids.indexOf(x)<0)ids.push(x)});
 s+='<div class="card"><h2>Stage 1: know the chords</h2><div class="row" style="justify-content:space-around">';ids.forEach(function(x){s+='<div style="text-align:center">'+diagram(x,90)+'<div><button class="btn" data-a="shear" data-v="'+x+'">'+CH[x].n+'</button></div></div>'});
 s+='</div></div><div class="card"><h2>Stage 2: lessons that feed this song</h2><div class="row">';
 g.les.forEach(function(x){s+='<span class="chip'+(D.done[x]?' cur':'')+'">'+(D.done[x]?'✓ ':'')+(x+1)+'. '+LES[x][0]+'</span>'});
 s+='</div><div class="row" style="margin-top:8px"><button class="btn" data-a="ltool" data-v="learn">Open lessons</button></div></div>';
 var nl=0;u.forEach(function(x){if(D.sec[S.sg+':'+x])nl++});
 s+='<div class="card"><h2>Stage 3: learn each section ('+nl+' of '+u.length+')</h2>';
 u.forEach(function(x){s+='<div class="row" style="margin:6px 0"><b style="width:70px">'+x+'</b>';sbars(g,x).forEach(function(c){s+='<span class="chip">'+CH[c].n+'</span>'});s+='<button class="btn" data-a="sloop" data-v="'+x+'">▶ Loop</button><button class="btn'+(D.sec[S.sg+':'+x]?' on':'')+'" data-a="slearn" data-v="'+x+'">'+(D.sec[S.sg+':'+x]?'✓ Learned':'Mark learned')+'</button></div>'});
 s+='</div><div class="card"><h2>Stage 4: the full chord chart</h2><p class="muted">One chord per bar, four bars per line. No lyrics, so there is nothing to copy: the structure is yours to play.</p><div class="row" style="margin-bottom:8px"><button class="btn pri" data-a="sfull">'+(S.play?'■ Stop':'▶ Play full song')+'</button></div>';
 for(i=0;i<g.form.length;i++){s+='<div class="row" style="margin:6px 0"><b style="width:70px">'+g.form[i]+'</b>';sbars(g,g.form[i]).forEach(function(c){s+='<span class="chip pchip" style="min-width:56px;text-align:center">'+CH[c].n+'</span>'});s+='</div>'}
 return s+'</div>'}
function songStart(bars,off){stopPlay();S.prog=bars;S.poff=off;var g=SONGS[S.sg];S.mode=g.m;S.pat=g.p;startPlay()}
/* ---------- timers ---------- */
var trT=null,prT=null;
function trTick(){S.tr.left--;if(S.tr.left<=0){var key=S.tr.a+'-'+S.tr.b;if(S.tr.count>(D.best[key]||0)){D.best[key]=S.tr.count}save();S.tr.run=false;clearInterval(trT);pluck(81,0,.8)}
 if(S.tab==='chords'){if(S.tr.run){document.getElementById('trclock').textContent=S.tr.left}else render()}}
function prTick(){var p=S.pr;p.left--;D.log[today()]=(D.log[today()]||0)+1;save();
 if(p.left<=0){pluck(81,0,.9);if(p.blk<p.blocks.length-1){p.blk++;p.left=p.blocks[p.blk].s}else{p.run=false;clearInterval(prT);p.blk=0;p.left=0}render()}
 else{var e=document.getElementById('prclock');if(e)e.textContent=fmt(p.left);if(p.left%30===0)stats()}}
/* ---------- events ---------- */
document.addEventListener('click',function(e){var el=e.target,a,v,i;while(el&&el!==document&&!el.getAttribute('data-a'))el=el.parentNode;if(!el||el===document)return;a=el.getAttribute('data-a');v=el.getAttribute('data-v');ac();
 if(a==='tab'){stopDrone();if(S.play)stopPlay();S.tab=v;render()}
 else if(a==='lsub'){stopDrone();S.lead=v;render()}
 else if(a==='lmode'){stopDrone();S.mi=+v;render()}
 else if(a==='ltri'){S.ti=+v;render()}
 else if(a==='lblues'){stopDrone();S.bl=v;render()}
 else if(a==='lplay'){leadPlay()}
 else if(a==='ldrone'){leadDrone();render()}
 else if(a==='chord'){S.chord=v;render();strum(v,'D',0,.9)}
 else if(a==='strum'){if(v==='D')strum(S.chord,'D',0,.9);else{var st=strings(S.chord);for(i=0;i<st.length;i++)pluck(midi(S.chord,st[i]),ac().currentTime+i*.18,.8)}}
 else if(a==='str'){var si=+v;pluck(midi(S.chord,si),0,.9)}
 else if(a==='addprog'){if(S.prog.length<8)S.prog.push(S.chord);S.tab='rhythm';render()}
 else if(a==='delprog'){S.prog.splice(+v,1);if(!S.prog.length&&S.play)stopPlay();else render()}
 else if(a==='mode'){S.mode=v;S.pat=v==='strum'?'Old faithful':'Travis';render()}
 else if(a==='pat'){S.pat=v;render()}
 else if(a==='play'){S.poff=0;S.play?stopPlay():startPlay()}
 else if(a==='trgo'){if(S.tr.run){S.tr.run=false;clearInterval(trT)}else{S.tr.run=true;S.tr.left=60;S.tr.count=0;clearInterval(trT);trT=setInterval(trTick,1000)}render()}
 else if(a==='trhit'){trHit()}
 else if(a==='fbnew'){newFb();render()}
 else if(a==='fblab'){S.fb.labels=!S.fb.labels;render()}
 else if(a==='fbhit'&&S.fb.t){var s=+el.getAttribute('data-s'),f=+el.getAttribute('data-f');pluck(OPEN[s]+f,0,.9);var ok=(OPEN[s]+f)%12===S.fb.t.n&&s===S.fb.t.s;
  if(ok){S.fb.streak++;if(S.fb.streak>D.fbBest){D.fbBest=S.fb.streak;save()}S.fb.msg='<span class="good">Correct! Fret '+f+'.</span>';newFb();render()}
  else{S.fb.streak=0;S.fb.msg='<span class="bad">That was '+NOTES[(OPEN[s]+f)%12]+' on the '+SN[s]+' string. Try again.</span>';render()}}
 else if(a==='capokey'){S.capoKey=+v;render()}
 else if(a==='pdur'){S.pr.dur=+v;S.pr.blocks=blocks(+v);S.pr.blk=0;S.pr.left=0;S.pr.run=false;clearInterval(prT);render()}
 else if(a==='prgo'){if(S.pr.run){S.pr.run=false;clearInterval(prT)}else{S.pr.run=true;clearInterval(prT);prT=setInterval(prTick,1000)}render()}
 else if(a==='prskip'){var p=S.pr;if(p.blk<p.blocks.length-1){p.blk++;p.left=p.blocks[p.blk].s}render()}
 else if(a==='prgoto'){S.tab=S.pr.blocks[S.pr.blk].t;render()}
 else if(a==='lsw'){S.ls=v;render()}
 else if(a==='lopen'){S.ol=S.ol===+v?-1:+v;render()}
 else if(a==='ltool'){stopDrone();S.tab=v;render()}
 else if(a==='ldone'){D.done[v]=!D.done[v];save();render()}
 else if(a==='hcat'){S.hc=v;render()}
 else if(a==='htry'){D.tried[v]=!D.tried[v];save();render()}
 else if(a==='emode'){S.ear={m:v,q:null,st:0,msg:''};render()}
 else if(a==='enew'){S.ear.msg='';newEar();render()}
 else if(a==='erep'){playEar()}
 else if(a==='eans'&&S.ear.q){var e=S.ear,A=e.m==='int'?INT:QUA;if(+v===e.q.a){e.st++;if(e.st>D.earBest){D.earBest=e.st;save()}e.msg='<span class="good">Correct: '+A[+v][0]+'.</span>';newEar();render()}else{e.st=0;e.msg='<span class="bad">That was '+A[e.q.a][0]+'. Listen again.</span>';render();playEar()}}
 else if(a==='bkey'){if(S.play)stopPlay();S.key=+v;render()}
 else if(a==='bhear'){strum(cid(S.key,+v),'D',0,.9)}
 else if(a==='badd'){if(S.play)stopPlay();if(S.bp.length<8)S.bp.push(+v);render()}
 else if(a==='bdel'){if(S.play)stopPlay();S.bp.splice(+v,1);render()}
 else if(a==='bpre'){if(S.play)stopPlay();S.bp=PRE[+v][1].slice();render()}
 else if(a==='bplay'){if(S.play)stopPlay();else if(S.bp.length){S.prog=S.bp.map(function(d){return cid(S.key,d)});S.poff=0;startPlay()}}
 else if(a==='sgsel'){if(S.play)stopPlay();S.sg=+v;var g=SONGS[+v];S.bpm=g.bpm;S.mode=g.m;S.pat=g.p;render()}
 else if(a==='shear'){strum(v,'D',0,.9)}
 else if(a==='slearn'){D.sec[S.sg+':'+v]=!D.sec[S.sg+':'+v];save();render()}
 else if(a==='sfull'){if(S.play)stopPlay();else songStart(sflat(SONGS[S.sg]),0)}
 else if(a==='sloop'){var g2=SONGS[S.sg],off=0,j;for(j=0;j<g2.form.length&&g2.form[j]!==v;j++)off+=4;songStart(sbars(g2,v),off)}
 else if(a==='tune'){pluck(OPEN[+v],0,1)}});
document.addEventListener('change',function(e){var a=e.target.getAttribute('data-a');
 if(a==='bpat'){var pv=e.target.value.split(':');S.mode=pv[0]==='s'?'strum':'finger';S.pat=pv[1];render()}else if(a==='skey'){if(S.play)stopPlay();S.sk=+e.target.value;render()}else if(a==='tra'){S.tr.a=e.target.value;render()}else if(a==='trb'){S.tr.b=e.target.value;render()}
 else if(a==='padd'&&e.target.value!=='+ add'&&S.prog.length<8){S.prog.push(e.target.value);render()}});
document.addEventListener('input',function(e){if(e.target.getAttribute('data-a')==='bpm'){S.bpm=+e.target.value;document.getElementById('bpmv').textContent=S.bpm}});
document.addEventListener('keydown',function(e){if(e.code==='Space'&&S.tab==='chords'&&S.tr.run&&e.target.tagName!=='SELECT'){e.preventDefault();trHit()}});
function trHit(){if(!S.tr.run)return;S.tr.count++;var k=S.tr.count%2?S.tr.b:S.tr.a;strum(k,'D',0,.8);document.getElementById('trcount').textContent=S.tr.count}
function newFb(){S.fb.t={s:Math.floor(Math.random()*6),n:Math.floor(Math.random()*12)}}
render();
})();
</script></body></html>
